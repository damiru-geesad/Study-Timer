<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Study Timer</h1>
        <p>Stay Focused. Keep Learning.</p>

        <div class="custom-time">
            <h3>Set Your Study Time</h3>

            <div class="time-inputs">

                <div>
                    <label>Hours</label>
                    <input type="number" id="hours" min="0" max="99" value="0">
                </div>
                <div>
                    <label>Minutes</label>
                    <input type="number" id="minutesInput" min="0" max="59" value="25">
                </div>
                <div>
                    <label>Seconds</label>
                    <input type="number"id="secondsInput" min="0" max="59" value="0">
                </div>
            </div>
            <button id="setTime">Set Time</button>
        </div>

        <div class="timer">
            <h2 id="time">25:00</h2>
        </div>

        <div class="buttons">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
